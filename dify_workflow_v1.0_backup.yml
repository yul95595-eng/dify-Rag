    - data:
        code: "def main(result: list) -> dict:\n    FALLBACK_HINT = \"（本次检索未召回任何知识库内容）\"\
          \n    chunks = result if isinstance(result, list) else []\n    parts = []\n\
          \    top_score = 0.0\n    for i, seg in enumerate(chunks, 1):\n        if\
          \ not isinstance(seg, dict):\n            continue\n        content = str(seg.get(\"\
          content\") or \"\").strip()\n        if not content:\n            continue\n\
          \        meta = seg.get(\"metadata\") or {}\n        doc_name = (meta.get(\"\
          document_name\") or meta.get(\"dataset_name\") or seg.get(\"title\") or\
          \ \"unknown\")\n        title = str(seg.get(\"title\") or \"\").strip()\n\
          \        try:\n            score = float(seg.get(\"score\") or 0.0)\n  \
          \      except Exception:\n            score = 0.0\n        top_score = max(top_score,\
          \ score)\n        head = \"【片段\" + str(i) + \"】来源文档: \" + str(doc_name)\n\
          \        if title:\n            head += \" | 章节: \" + title\n        head\
          \ += \" | 相关度: %.3f\" % score\n        parts.append(head + \"\\n\" + content)\n\
          \    knowledge_context = \"\\n\\n\".join(parts) if parts else FALLBACK_HINT\n\
          \    return {\n        \"knowledge_context\": knowledge_context,\n     \
          \   \"retrieval_hit\": 1 if parts else 0,\n        \"top_score\": round(top_score,\
          \ 4),\n    }"
        code_language: python3
