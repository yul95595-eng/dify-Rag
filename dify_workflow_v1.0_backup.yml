    - data:
        code: "import json\n\nQUOTE = chr(34)\nBACKSLASH = chr(92)\nFENCE = chr(96)\
          \ * 3\n\n\ndef strip_think(s):\n    s = s or \"\"\n    i = s.find(\"<think>\"\
          )\n    while i >= 0:\n        j = s.find(\"</think>\", i)\n        if j\
          \ < 0:\n            s = s[:i]\n            break\n        s = s[:i] + s[j\
          \ + 8:]\n        i = s.find(\"<think>\")\n    return s.strip()\n\n\ndef\
          \ json_blocks(s):\n    blocks = []\n    depth = 0\n    start = -1\n    in_str\
          \ = False\n    esc = False\n    for i in range(len(s)):\n        ch = s[i]\n\
          \        if in_str:\n            if esc:\n                esc = False\n\
          \            elif ch == BACKSLASH:\n                esc = True\n       \
          \     elif ch == QUOTE:\n                in_str = False\n            continue\n\
          \        if ch == QUOTE:\n            in_str = True\n        elif ch ==\
          \ \"{\":\n            if depth == 0:\n                start = i\n      \
          \      depth += 1\n        elif ch == \"}\":\n            if depth > 0:\n\
          \                depth -= 1\n                if depth == 0 and start >=\
          \ 0:\n                    blocks.append(s[start:i + 1])\n              \
          \      start = -1\n    return blocks\n\n\ndef strip_fence(s):\n    body\
          \ = (s or \"\").strip()\n    if body.startswith(FENCE):\n        nl = body.find(chr(10))\n\
          \        if nl >= 0:\n            body = body[nl + 1:]\n        body = body.rstrip()\n\
          \        if body.endswith(FENCE):\n            body = body[:-3]\n    return\
          \ body.strip()\n\nFALLBACK = \"暂未找到明确制度，建议转人工处理。\"\nDEFAULT_SUGGESTION =\
          \ (\"该问题暂未被知识库覆盖，建议提交人工工单：说明问题背景、发生时间、\"\n                      \"涉及部门与期望处理时限，由对应归口部门跟进答复。\"\
          )\n\n\ndef main(text: str, question: str, category: str, retrieval_hit:\
          \ int) -> dict:\n    raw_all = (text or \"\").strip()\n    raw = strip_think(raw_all)\
          \ or raw_all\n    parsed = {}\n    for cand in [raw] + json_blocks(raw):\n\
          \        cand = (cand or \"\").strip()\n        if not cand:\n         \
          \   continue\n        try:\n            obj = json.loads(cand)\n       \
          \ except Exception:\n            continue\n        if isinstance(obj, dict)\
          \ and (\"answer\" in obj or \"suggestion\" in obj):\n            parsed\
          \ = obj\n            break\n    if not parsed:\n        for cand in json_blocks(raw):\n\
          \            try:\n                obj = json.loads(cand)\n            except\
          \ Exception:\n                continue\n            if isinstance(obj, dict):\n\
          \                parsed = obj\n                break\n\n    answer = str(parsed.get(\"\
          answer\") or \"\").strip()\n    if not answer:\n        body = strip_fence(raw)\n\
          \        answer = body if body else FALLBACK\n\n    suggestion = str(parsed.get(\"\
