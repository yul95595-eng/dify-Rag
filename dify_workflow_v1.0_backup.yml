            DNS VPN代理故障/企业邮箱收发与配置/钓鱼邮件与信息安全/软件安装与正版授权/IT工单与响应时效/办公终端与网络设备故障；后勤=食堂就餐与餐补/食品安全投诉/员工宿舍申请入住退宿与水电分摊/保洁与特殊清洁申请/水电空调电梯维修报修/停车场车位申请与违规处理/节能管理；其他=闲聊、创作类请求、知识库中不存在的内容、订票等外部操作请求、主观人际咨询、索取真实电话邮箱网址或真实企业制度、无法判断归属的问题
